apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "terminus.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminus.labels" . | nindent 4 }}
data:
  TZ: {{ .Values.app.timezone | quote }}
  RACK_ATTACK_ALLOWED_SUBNETS: {{ .Values.app.rackAttackAllowedSubnets | quote }}
