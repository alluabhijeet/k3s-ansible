apiVersion: v1
kind: Service
metadata:
  name: {{ include "terminus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "terminus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 2345
